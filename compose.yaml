name: hioki-projectdata-manager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectdata}
      POSTGRES_USER: ${POSTGRES_USER:-projectdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectdata-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-projectdata}:${POSTGRES_PASSWORD:-projectdata-local}@db:5432/${POSTGRES_DB:-projectdata}
      ARCHIVE_ROOT: /data/archives
      REBUILD_INDEX_ON_STARTUP: ${REBUILD_INDEX_ON_STARTUP:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - "${ARCHIVE_STORAGE:-project_archives}:/data/archives"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80"

volumes:
  postgres_data:
  project_archives:
