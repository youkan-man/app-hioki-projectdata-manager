[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gennect-project-manager-api"
version = "0.1.0"
description = "Shared archive and version API for HIOKI GENNECT Space projects"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

