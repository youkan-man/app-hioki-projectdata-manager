services:
  web-https:
    profiles: ["https"]
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./.certs/tls.crt}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_FILE:-./.certs/tls.key}:/etc/nginx/tls/tls.key:ro

